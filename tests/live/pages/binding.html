<!doctype html>
<meta charset="utf-8">
<title>binding</title>
<h1>binding</h1>
<script>
  // Runtime.addBinding installs a function on window that, when the page calls
  // it, sends its single string argument to the driver. This is how in-page
  // code pushes to Python without polling.
  window.report = function (what) {
    if (typeof window.wirespecReport === "function") {
      window.wirespecReport(JSON.stringify(what));
      return true;
    }
    return false;
  };
</script>
