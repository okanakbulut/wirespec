<!doctype html>
<meta charset="utf-8">
<title>input</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  #button { position: absolute; left: 20px; top: 30px; width: 120px; height: 40px; }
  #field  { position: absolute; left: 20px; top: 100px; width: 240px; }
  #pad    { position: absolute; left: 20px; top: 160px; width: 300px; height: 120px; background: #eee; }
</style>

<button id="button">Press me</button>
<input id="field">
<div id="pad">move over me</div>

<script>
  window.__clicks = [];
  window.__keys = [];
  window.__mouse = [];

  const button = document.getElementById('button');
  for (const name of ['click', 'dblclick', 'mousedown', 'mouseup', 'contextmenu']) {
    button.addEventListener(name, (e) => {
      window.__clicks.push([name, e.button, e.detail]);
      if (name === 'contextmenu') e.preventDefault();
    });
  }

  const field = document.getElementById('field');
  for (const name of ['keydown', 'keypress', 'keyup', 'input']) {
    field.addEventListener(name, (e) => {
      window.__keys.push([name, e.key ?? null, e.target.value]);
    });
  }

  const pad = document.getElementById('pad');
  for (const name of ['mouseenter', 'mousemove', 'mouseleave']) {
    pad.addEventListener(name, (e) => { window.__mouse.push([name, Math.round(e.clientX), Math.round(e.clientY)]); });
  }

  window.__reset = () => { window.__clicks = []; window.__keys = []; window.__mouse = []; };
</script>
