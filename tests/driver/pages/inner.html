<!doctype html>
<meta charset="utf-8">
<title>inner</title>
<h1>inside the frame</h1>
<button id="press">Press me</button>
<label for="who">Name</label>
<input id="who" name="who">
<p id="said">nothing yet</p>
<script>
  document.getElementById("press").addEventListener("click", () => {
    document.getElementById("said").textContent = "pressed";
  });
  // A late arrival, so a locator inside a frame has something to wait for.
  setTimeout(() => {
    const p = document.createElement("p");
    p.id = "eventually";
    p.textContent = "here at last";
    document.body.appendChild(p);
  }, 300);
</script>
